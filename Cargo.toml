[package]
name = "sigmaos_jaeger"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1.0"

[lib]
name = "sigmaos_jaeger"
path = "src/lib.rs"
